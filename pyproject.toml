[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-wrapped-str"
version = "0.1.0"
description = "WrappedStr / CaseInsensitiveWrappedStr and string helpers (MutableStr in some docs)"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "bodencrouch" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/bodencrouch/python-wrapped-str"
Repository = "https://github.com/bodencrouch/python-wrapped-str"

[tool.setuptools.packages.find]
where = ["src"]
